name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Start LocalStack
        run: docker-compose up -d

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pylint (Linting)
        run: |
          pylint --fail-under 7 --disable=C0114,C0115,C0116,W0301,C0301,C0321,W0611,C0304 app/ services/

      - name: Run Unit Tests (Lab 2)
        run: |
          python -m unittest tests/test_eshop_unit.py

      - name: Run BDD Tests (Lab 1)
        run: |
          behave

      - name: Run Integration Tests & Coverage (Lab 3)
        run: |
          coverage run -m pytest tests/test_integration.py
          coverage report -m

      - name: Teardown Docker
        if: always()
        run: docker-compose down